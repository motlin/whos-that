onlyBuiltDependencies:
  - esbuild
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.1.0
  vite-plus: 1.3.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # Older postcss reads arbitrary .map files from an attacker-controlled sourceMappingURL (GHSA-6g55-p6wh-862q).
  postcss: ">=8.5.23"
  # Quadratic-time lookbehind matching in older re2js, pulled in by markdownlint (GHSA-gg6h-894w-4m9c).
  re2js: ">=2.8.7"
  # Prototype pollution bypassing trust restrictions in older katex, pulled in by markdownlint's math extension (GHSA-238p-pmpm-9mq7).
  katex: ">=0.18.2"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  esbuild: true
  fallow: true
  sharp: false
  workerd: true
