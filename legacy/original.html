<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who's That?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#2a2522;--paper:#fffdf6;--line:#dfe8f5;--good:#2fb36b;--bad:#e5484d;--sun:#ffe066}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Patrick Hand',system-ui,sans-serif;color:var(--ink);font-size:20px;background-color:var(--paper);
 background-image:linear-gradient(90deg,transparent 38px,#f4bcbc 38px,#f4bcbc 40px,transparent 40px),linear-gradient(var(--line) 1.5px,transparent 1.5px);
 background-size:100% 100%,100% 30px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{touch-action:manipulation}
#screen{max-width:1100px;margin:0 auto;padding:62px 14px 28px;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.sketch{background:#fff;border:3px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;box-shadow:3px 4px 0 rgba(0,0,0,.14)}
.btn{font:inherit;font-size:22px;color:var(--ink);padding:9px 22px;background:#fff;border:3px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;cursor:pointer;box-shadow:2px 3px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translate(2px,3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--sun)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.corner{position:fixed;top:10px;z-index:30;width:48px;height:48px;padding:0;font-size:24px;display:flex;align-items:center;justify-content:center}
#snd{right:10px}#home{left:10px}
#home.hide{display:none}
.logo{font-family:'Gochi Hand',cursive;font-size:clamp(56px,12vw,104px);margin:0;line-height:1;transform:rotate(-3deg);text-shadow:4px 4px 0 var(--sun)}
.tag{font-size:24px;margin:6px 0 18px}
.hero{width:160px;padding:6px;margin-top:10px;transform:rotate(2deg)}
.hero svg{display:block;width:100%;height:auto}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;width:100%;max-width:980px}
.mode{font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 14px;cursor:pointer;text-align:center;transition:transform .12s}
.mode:hover{transform:scale(1.04) rotate(0deg)!important}
.mode:nth-child(1){background:#ffe3e3;transform:rotate(-1.2deg)}
.mode:nth-child(2){background:#e1f0ff;transform:rotate(1deg)}
.mode:nth-child(3){background:#e4f8e4;transform:rotate(-.8deg)}
.mode:nth-child(4){background:#f2e7ff;transform:rotate(1.2deg)}
.mi{font-size:38px}.mt{font-family:'Gochi Hand',cursive;font-size:30px}.md{font-size:18px;line-height:1.2}
.hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:2px}
.hud span{background:#fff;border:2px solid var(--ink);border-radius:14px 5px 14px 5px;padding:1px 12px;font-size:19px}
.prompt{font-family:'Gochi Hand',cursive;font-size:clamp(30px,5.4vw,44px);margin:6px 0 10px;text-align:center;line-height:1.1}
.prompt.bad{color:var(--bad)}
.facecard{background:#fff;border:3px solid var(--ink);border-radius:20px 7px 22px 8px/8px 22px 7px 20px;padding:4px;position:relative;font:inherit;color:inherit;margin:0}
.facecard svg{display:block;width:100%;height:auto}
.facecard.big{width:min(78vw,46vh,360px)}
.memo{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.memo-2 .facecard.big{width:min(43vw,40vh,320px)}
.memo-3 .facecard.big{width:min(30vw,36vh,290px)}
.badge{position:absolute;top:-12px;left:-12px;width:36px;height:36px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Gochi Hand';font-size:24px;z-index:2}
.grid{display:grid;gap:12px;justify-content:center;width:100%}
.pick{cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:2px 3px 0 rgba(0,0,0,.18)}
.pick:hover{transform:rotate(-1.5deg) scale(1.03)}
.pick:nth-child(even):hover{transform:rotate(1.5deg) scale(1.03)}
.pick.right,.pick.found{border-color:var(--good);box-shadow:0 0 0 5px var(--good)}
.pick.found::after{content:'✓';position:absolute;top:-14px;right:-10px;background:var(--good);color:#fff;width:38px;height:38px;border-radius:50%;font-size:26px;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink)}
.tapme{cursor:crosshair}
.timer{width:min(520px,90%);height:24px;border:3px solid var(--ink);border-radius:12px 4px 12px 4px;margin:14px auto 4px;position:relative;background:#fff;overflow:hidden}
.timer .fill{height:100%;width:100%;background:repeating-linear-gradient(-45deg,#8fd0ff 0 8px,#62b2f2 8px 16px)}
.timer.low .fill{background:repeating-linear-gradient(-45deg,#ff9a9a 0 8px,#ff6b6b 8px 16px)}
.timer .num{position:absolute;inset:0;text-align:center;line-height:18px;font-size:19px;font-weight:bold}
.hl{fill:none;stroke:var(--bad);stroke-width:4.5;stroke-dasharray:10 6;animation:pulse .8s ease-in-out infinite alternate}
.hl.good{stroke:var(--good)}
.xmark path{stroke:var(--bad);stroke-width:6;stroke-linecap:round;fill:none}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.compare{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.compare .facecard.big{width:min(42vw,34vh,290px)}
.compare figcaption{text-align:center;font-size:20px;padding-top:2px}
.facecard.ok{border-color:var(--good);box-shadow:0 0 0 4px var(--good)}
.facecard.wrong{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad)}
.diffs{font-size:22px;margin:12px 0 4px;text-align:center}
.final{padding:14px 26px;margin-top:10px;text-align:center;width:min(520px,100%)}
.bigscore{font-family:'Gochi Hand';font-size:64px;line-height:1}
.hs-area{margin-top:10px;min-height:30px}
.newhs{font-family:'Gochi Hand';font-size:30px;color:#d4840a}
.nameRow{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.nameRow input{font:inherit;font-size:24px;padding:6px 12px;border:3px solid var(--ink);border-radius:12px 4px 12px 4px;width:200px;background:#fffef2;color:#2a2522;-webkit-text-fill-color:#2a2522;caret-color:#2a2522}
.nameRow input::placeholder{color:#9a948c;-webkit-text-fill-color:#9a948c}
.build{display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:wrap;width:100%}
.build .facecard.big{width:min(60vw,36vh,320px)}
@media (max-width:700px){.build .facecard.big{width:min(46vw,27vh)}.bopts{gap:7px}.blabel{font-size:26px}}
.bpanel{flex:1 1 320px;max-width:540px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:17px;padding:3px 10px;border:2px solid var(--ink);border-radius:12px 4px 12px 4px;background:#fff;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--sun)}
.chip.done{border-color:var(--good)}
.blabel{font-family:'Gochi Hand';font-size:30px;text-align:center}
.bopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{aspect-ratio:1;cursor:pointer;padding:3px}
.opt svg{width:100%;height:100%}
.opt.sel{border-color:#d4a017;box-shadow:0 0 0 5px #ffd23f}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center}
.lvl{font-family:'Gochi Hand';font-size:clamp(70px,16vw,120px);animation:pop .5s ease-out;transform:rotate(-4deg)}
.sub{font-size:28px;max-width:600px}
@keyframes pop{0%{transform:scale(.3) rotate(-12deg);opacity:0}70%{transform:scale(1.12) rotate(-2deg)}100%{transform:scale(1) rotate(-4deg)}}
.float{position:fixed;transform:translateX(-50%);font-family:'Gochi Hand';font-size:42px;color:var(--good);pointer-events:none;animation:floatUp 1.25s ease-out forwards;z-index:40;text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff;white-space:nowrap}
@keyframes floatUp{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-90px}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.tab{font:inherit;font-size:19px;padding:5px 12px;border:2px solid var(--ink);border-radius:14px 5px 14px 5px;background:#fff;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--sun)}
.board{width:min(560px,100%);padding:12px 22px}
.brow{display:grid;grid-template-columns:42px 1fr auto auto;gap:12px;padding:6px 4px;border-bottom:2px dashed #ddd;align-items:center}
.brow:last-child{border-bottom:none}
.brow.me{background:#fff3b0;border-radius:8px}
.brow .rk{font-family:'Gochi Hand';font-size:26px}
.brow .sc{font-weight:bold}
.brow .lv{font-size:16px;color:#777}
.note{font-size:17px;color:#666;text-align:center;margin:8px 0 0}
.empty{text-align:center;padding:16px;color:#777}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:min(720px,100%);margin-top:12px}
.cat{font:inherit;font-size:21px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:16px 6px 16px 6px;padding:8px 10px;cursor:pointer;box-shadow:2px 3px 0 var(--ink);display:flex;align-items:center;gap:8px;justify-content:center}
.cat:active{transform:translate(2px,3px);box-shadow:none}
.cat.right{background:#c9f2d8;border-color:var(--good)}
.spotwrap .facecard.big{width:min(70vw,38vh,330px)}
.looking{font-family:'Gochi Hand';font-size:clamp(40px,9vw,70px)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <filter id="wob" filterUnits="userSpaceOnUse" x="-40" y="-80" width="280" height="360">
   <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="n"/>
   <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
 </defs>
</svg>
<button class="btn corner" id="home" title="Menu">🏠</button>
<button class="btn corner" id="snd" title="Sound">🔊</button>
<div id="screen"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const range=n=>[...Array(n).keys()];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- face data ---------- */
const SKIN=['#fde3c8','#f5c79e','#e0a878','#c58552','#9a5f37','#6b4226'];
const HAIRC=['#2b2118','#734a26','#ecc65a','#c9512b','#a9a9a9','#4a8fe0','#ff7eb6'];
const EYEC=['#6b3e1f','#3a7bd5','#3fa34d','#8a8f98','#9b4dca'];
const CLOTH=['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#ff8c42','#1abc9c'];
const HATC=['#e74c3c','#3498db','#2ecc71','#9b59b6','#ff8c42','#f06292'];
const FEATURES={
 faceShape:{n:5,label:'face shape'},
 skin:{n:6,label:'skin color'},
 hairStyle:{n:10,label:'hair style'},
 hairColor:{n:7,label:'hair color'},
 eyebrows:{n:6,label:'eyebrows'},
 eyes:{n:7,label:'eyes'},
 eyeColor:{n:5,label:'eye color'},
 nose:{n:7,label:'nose'},
 mouth:{n:8,label:'mouth'},
 ears:{n:5,label:'ears'},
 facialHair:{n:6,label:'beard or mustache',w:[10,2,1,2,1.5,1.5]},
 glasses:{n:6,label:'glasses',w:[11,2,2,1.5,1,1]},
 hat:{n:8,label:'hat',w:[12,1.5,1.5,1,1,1,1,1]},
 hatColor:{n:6,label:'hat color'},
 cheeks:{n:6,label:'cheeks',w:[4,1.5,1.5,1,1,1]},
 earrings:{n:3,label:'earrings',w:[5,1.5,1.5]},
 neckwear:{n:5,label:'neckwear',w:[4,1.5,1.5,1.5,1.5]},
 shirt:{n:7,label:'shirt color'}
};
const KEYS=Object.keys(FEATURES);
const HAT_COLORED=[1,2,3,5,6,7];
function visible(f,k){
 if((k==='eyes'||k==='eyeColor')&&f.glasses===3) return false;
 if(k==='hatColor'&&!HAT_COLORED.includes(f.hat)) return false;
 return true;
}
function valid(f){return !(f.hat&&f.hairStyle===7)}
function randFeat(k){const F=FEATURES[k];if(F.w){const t=F.w.reduce((a,b)=>a+b);let r=Math.random()*t;for(let i=0;i<F.n;i++){r-=F.w[i];if(r<0)return i}return 0}return rnd(F.n)}
function randomFace(){let f;do{f={};KEYS.forEach(k=>f[k]=randFeat(k))}while(!valid(f));return f}
const visKey=f=>KEYS.map(k=>visible(f,k)?f[k]:'x').join(',');
const diffKeys=(a,b)=>KEYS.filter(k=>a[k]!==b[k]&&visible(a,k)&&visible(b,k));
function makeDecoy(t,n,pool,used){
 for(let tries=0;tries<300;tries++){
  const d={...t};let done=0;
  for(const k of shuffle([...new Set(pool)])){
   if(done>=n)break;
   if(!visible(d,k))continue;
   const old=d[k];let ok=false;
   for(const v of shuffle(range(FEATURES[k].n).filter(v=>v!==old))){d[k]=v;if(valid(d)&&visible(d,k)){ok=true;break}}
   if(ok)done++;else d[k]=old;
  }
  if(done<Math.min(n,1)||!diffKeys(t,d).length)continue;
  const vk=visKey(d);if(used.has(vk))continue;used.add(vk);return d;
 }
 let f;do{f=randomFace()}while(used.has(visKey(f)));used.add(visKey(f));return f;
}

/* ---------- difficulty ---------- */
const POOLS=[
 ['hat','glasses','hairStyle','hairColor','facialHair','shirt','neckwear'],
 ['hat','glasses','hairStyle','hairColor','facialHair','shirt','neckwear','mouth','nose','eyes','ears','cheeks','eyebrows','skin'],
 ['mouth','nose','eyes','ears','cheeks','eyebrows','faceShape','skin','hatColor','neckwear','glasses','hairStyle'],
 ['mouth','nose','eyes','ears','cheeks','eyebrows','faceShape','hatColor','eyeColor','earrings'],
 ['eyeColor','earrings','eyebrows','nose','ears','cheeks','hatColor','mouth']
];
const stage=L=>L<=3?0:L<=6?1:L<=10?2:L<=14?3:4;
function cfg(L){return{mem:Math.max(5,10-Math.floor((L-1)/3)),choices:Math.min(8,3+Math.floor((L-1)/3)),changes:L<=3?3:L<=7?2:1,pool:POOLS[stage(L)],pick:Math.max(6,20-(L-1))}}
const BUILD_ALL=['faceShape','skin','hairStyle','hairColor','eyebrows','eyes','eyeColor','nose','mouth','ears','facialHair','glasses','hat','cheeks','earrings','neckwear','shirt'];
const BUILD_EASY=['hairStyle','hairColor','hat','glasses','facialHair','shirt','mouth','eyes','nose','neckwear','cheeks'];
const PLAIN={faceShape:0,skin:1,hairStyle:1,hairColor:1,eyebrows:0,eyes:0,eyeColor:0,nose:0,mouth:0,ears:0,facialHair:0,glasses:0,hat:0,hatColor:0,cheeks:0,earrings:0,neckwear:0,shirt:1};
const buildCount=L=>Math.min(BUILD_ALL.length,2+L);
const buildFullAt=BUILD_ALL.length-2;
const buildMem=L=>L<=buildFullAt?Math.round(5+buildCount(L)*1.2):Math.max(10,Math.round(5+BUILD_ALL.length*1.2)-2*(L-buildFullAt));
const buildOpts=L=>Math.min(6,3+Math.floor((L-1)/4));

/* ---------- drawing ---------- */
const INK='#2a2522';
const SHAPES=[{w:60,t:44,b:196},{w:68,t:50,b:190},{w:62,t:48,b:194},{w:52,t:36,b:204},{w:62,t:46,b:200}];
function geo(f){const s=SHAPES[f.faceShape],h=s.b-s.t;return{...s,L:100-s.w,R:100+s.w,ey:s.t+h*.42,ny:s.t+h*.6,my:s.t+h*.76,ex:s.w*.42,cy:(s.t+s.b)/2,ry:h/2}}
function shade(hex,p){const n=parseInt(hex.slice(1),16);const c=[n>>16,n>>8&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(p<0?v*(1+p):v+(255-v)*p))));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
function star(cx,cy,R,r,n=5){let d='';for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,rr=i%2?r:R;d+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(1)+' '+(cy+Math.sin(a)*rr).toFixed(1)}return d+'Z'}
const N1=v=>v.toFixed(1);
const STUB=(()=>{let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;const a=[];while(a.length<46){const u=r()*2-1,v=r();if(Math.abs(u)<1-v*.55&&!(Math.abs(u)<.34&&v<.32))a.push([u,v])}return a})();

function headShape(f,g){const{w,t,b,cy,ry}=g;
 if(f.faceShape===2)return`<rect x="${100-w}" y="${t}" width="${2*w}" height="${b-t}" rx="28"/>`;
 if(f.faceShape===4)return`<path d="M${100-w} ${t+50} Q${100-w} ${t} 100 ${t} Q${100+w} ${t} ${100+w} ${t+50} Q${100+w-4} ${b-40} 100 ${b} Q${100-w+4} ${b-40} ${100-w} ${t+50}Z"/>`;
 return`<ellipse cx="100" cy="${cy}" rx="${w}" ry="${ry}"/>`;
}
function hairBack(f,g,hc){const{w,t,ey,L,R}=g;const st=`fill="${hc}"`;
 switch(f.hairStyle){
  case 3:return`<rect ${st} x="${L-12}" y="${t-8}" width="${2*w+24}" height="${ey+48-t}" rx="34"/>`;
  case 4:return`<path ${st} d="M${L-14} ${t+34} Q${L-16} ${t-12} 100 ${t-12} Q${R+16} ${t-12} ${R+14} ${t+34} L${R+22} 236 Q100 246 ${L-22} 236Z"/>`;
  case 5:{const cy=t+34,r=w+20;let p=`<circle ${st} cx="100" cy="${cy}" r="${r}"/>`;for(let i=0;i<14;i++){const a=Math.PI*(.8+i*1.4/13);p+=`<circle ${st} cx="${N1(100+Math.cos(a)*r)}" cy="${N1(cy+Math.sin(a)*r)}" r="15"/>`}return p}
  case 6:return`<ellipse ${st} cx="${R+14}" cy="${t+58}" rx="14" ry="32" transform="rotate(22 ${R+14} ${t+58})"/><circle fill="#ff4d6d" cx="${R+4}" cy="${t+32}" r="6"/>`;
  case 8:return`<circle ${st} cx="${L-14}" cy="${ey+4}" r="18"/><circle ${st} cx="${R+14}" cy="${ey+4}" r="18"/><circle fill="#ff4d6d" cx="${L}" cy="${ey-4}" r="5.5"/><circle fill="#ff4d6d" cx="${R}" cy="${ey-4}" r="5.5"/>`;
 }return'';
}
function hairFront(f,g,hc){const{w,t,ey,L,R,cy,ry}=g;const fb=ey-28;const st=`fill="${hc}"`;
 const P=(th,e=0)=>[N1(100+(w+3+e)*Math.cos(th)),N1(cy+(ry+3+e)*Math.sin(th))];
 const cap=`M${L-3} ${ey-8} C${L-8} ${t-30} ${R+8} ${t-30} ${R+3} ${ey-8}`;
 switch(f.hairStyle){
  case 0:return`<path d="M${N1(100-w*.45)} ${t+16} q12 -8 24 -5" stroke="#fff" stroke-width="4" fill="none" opacity=".85"/>`;
  case 1:case 6:return`<path ${st} d="${cap} Q${R-2} ${fb+2} ${R-14} ${fb} Q100 ${fb-16} ${L+14} ${fb} Q${L+2} ${fb+2} ${L-3} ${ey-8}Z"/>`;
  case 2:{const pts=[[L-3,ey-12]];const N=12;for(let i=0;i<=N;i++){const th=Math.PI*(1.08+.84*i/N);pts.push(P(th,i%2?20:0))}pts.push([R+3,ey-12]);for(let i=0;i<=7;i++){pts.push([N1(R-4-(2*w-8)*i/7),i%2?fb-9:fb])}return`<path ${st} d="M${pts.map(p=>p.join(' ')).join(' L')}Z"/>`}
  case 3:return`<path ${st} d="M${L-4} ${ey-4} C${L-8} ${t-30} ${R+8} ${t-30} ${R+4} ${ey-4} L${R-6} ${ey-6} L${R-8} ${fb} L${L+8} ${fb} L${L+6} ${ey-6}Z"/>`;
  case 4:return`<path ${st} d="M${L-4} ${ey+6} C${L-8} ${t-30} ${R+8} ${t-30} ${R+4} ${ey+6} Q${R-4} ${fb} ${R-20} ${fb-2} Q100 ${fb-6} 84 ${t+10} Q${L+12} ${fb+4} ${L+5} ${ey+6}Z"/>`;
  case 5:return`<path ${st} d="M${L-2} ${ey-10} C${L-6} ${t-28} ${R+6} ${t-28} ${R+2} ${ey-10} Q${R-6} ${fb} 100 ${fb-8} Q${L+6} ${fb} ${L-2} ${ey-10}Z"/>`;

/* ---------- leaderboard store ---------- */
const MODES=[
 {id:'classic',name:'Classic',icon:'🎯',desc:'Memorize a face, then pick it out of the lineup.'},
 {id:'spot',name:'Spot the Difference',icon:'🔍',desc:'The face comes back with something changed. Tap it!'},
 {id:'build',name:'Build It',icon:'✏️',desc:'Memorize what makes the face special, then build it back piece by piece.'},
 {id:'lineup',name:'Lineup',icon:'👥',desc:'Memorize 2 or 3 faces, then find every one.'}
];
const modeOf=id=>MODES.find(m=>m.id===id);
const timeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
const Store={
 db:null,uid:null,shared:false,
 initP:null,
 init(){return this.initP||(this.initP=(async()=>{
  try{
   if(!window.claude||typeof window.claude.use!=='function')return;
   const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
   if(!db||!user)return;const id=await user.id();if(!id)return;
   this.db=db;this.uid=id;this.shared=true;
  }catch(e){}
 })())},
 empty(){const o={};MODES.forEach(m=>o[m.id]=[]);return o},
 clean(e){if(!e||typeof e.s!=='number'||typeof e.n!=='string')return null;return{n:e.n.slice(0,12),s:Math.max(0,Math.floor(e.s)),l:Math.max(0,Math.floor(e.l||0)),t:Number(e.t)||0}},
 localRaw(){let o=this.empty();try{const x=JSON.parse(ls.get('wt_boards')||'{}');MODES.forEach(m=>{if(Array.isArray(x[m.id]))o[m.id]=x[m.id].map(e=>this.clean(e)).filter(Boolean)})}catch(e){}return o},
 sortTop(o){MODES.forEach(m=>{o[m.id].sort((a,b)=>b.s-a.s||a.t-b.t);o[m.id]=o[m.id].slice(0,10)});return o},
 async migrate(){
  if(!this.shared||this.migrated)return;this.migrated=true;
  const local=this.localRaw();if(!MODES.some(m=>local[m.id].length))return;
  try{
   const ref=this.db.doc('boards/'+this.uid);
   const snap=await timeout(ref.get(),10000);
   const cur=snap.exists?JSON.parse(JSON.stringify(snap.data()||{})):{};
   MODES.forEach(m=>{const arr=(Array.isArray(cur[m.id])?cur[m.id]:[]).map(e=>this.clean(e)).filter(Boolean);const seen=new Set(arr.map(e=>e.t+'|'+e.s));local[m.id].forEach(e=>{if(!seen.has(e.t+'|'+e.s))arr.push(e)});arr.sort((a,b)=>b.s-a.s);if(arr.length)cur[m.id]=arr.slice(0,10)});
   await timeout(ref.set(cur),10000);
   ls.set('wt_boards','{}');
  }catch(e){this.migrated=false}
 },
 async load(){
  await this.init();
  if(this.shared){
   await this.migrate();
   try{
    const snap=await timeout(this.db.collection('boards').get(),10000);
    const o=this.empty();
    snap.docs.forEach(d=>{const x=d.data()||{};MODES.forEach(m=>{if(Array.isArray(x[m.id]))x[m.id].forEach(e=>{const c=this.clean(e);if(c)o[m.id].push(c)})})});
    return this.sortTop(o);
   }catch(e){return this.sortTop(this.localRaw())}
  }
  return this.sortTop(this.localRaw());
 },
 async save(mode,entry){
  await this.init();
  if(this.shared){
   try{
    const ref=this.db.doc('boards/'+this.uid);
    const snap=await timeout(ref.get(),10000);
    const cur=snap.exists?JSON.parse(JSON.stringify(snap.data()||{})):{};
    const arr=(Array.isArray(cur[mode])?cur[mode]:[]).map(e=>this.clean(e)).filter(Boolean);
    arr.push(entry);arr.sort((a,b)=>b.s-a.s);cur[mode]=arr.slice(0,10);
    await timeout(ref.set(cur),10000);
    return true;
   }catch(e){}
  }
  const o=this.localRaw();o[mode].push(entry);this.sortTop(o);ls.set('wt_boards',JSON.stringify(o));
  return !this.shared;
 }
};
Store.init();

/* ---------- screen + timer helpers ---------- */
const G={mode:'classic',level:1,score:0,stops:[],screen:0};
function clearTimers(){G.stops.forEach(f=>{try{f()}catch(e){}});G.stops=[]}
function later(fn,ms){const id=setTimeout(fn,ms);G.stops.push(()=>clearTimeout(id))}
function show(html,inGame=true){clearTimers();G.screen++;$('#screen').innerHTML=html;$('#home').classList.toggle('hide',!inGame);window.scrollTo(0,0)}
const timerHTML=()=>`<div class="timer"><div class="fill"></div><div class="num"></div></div>`;
function timer(sec,el,onDone){
 const start=performance.now(),dur=sec*1000;let last=Math.ceil(sec),raf,dead=false;
 const step=now=>{if(dead)return;const rem=Math.max(0,dur-(now-start));
  if(el){el.querySelector('.fill').style.width=(rem/dur*100)+'%';el.querySelector('.num').textContent=Math.ceil(rem/1000);el.classList.toggle('low',rem<3000)}
  const whole=Math.ceil(rem/1000);if(whole<last){last=whole;if(whole<=3&&whole>0)SFX.tick()}
  if(rem<=0){dead=true;onDone();return}raf=requestAnimationFrame(step)};
 raf=requestAnimationFrame(step);
 const t={stop(){dead=true;cancelAnimationFrame(raf)},frac(){return Math.max(0,1-(performance.now()-start)/dur)}};
 G.stops.push(()=>t.stop());return t;
}
const hud=()=>`<div class="hud"><span>${modeOf(G.mode).icon} ${modeOf(G.mode).name}</span><span>Level <b>${G.level}</b></span><span>Score <b id="hudScore">${G.score}</b></span></div>`;
function floatText(txt,el){const r=el.getBoundingClientRect();const d=document.createElement('div');d.className='float';d.textContent=txt;d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+r.height*.3)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1300)}
function toVB(e,svg){const r=svg.getBoundingClientRect();return{x:VB[0]+(e.clientX-r.left)/r.width*VB[2],y:VB[1]+(e.clientY-r.top)/r.height*VB[3]}}
const inEl=(p,[cx,cy,rx,ry],k)=>((p.x-cx)/(rx*k))**2+((p.y-cy)/(ry*k))**2<=1;
function layoutGrid(n){
 const grid=$('#grid');if(!grid)return;
 const fit=()=>{const W=grid.clientWidth;const H=Math.max(240,window.innerHeight-grid.getBoundingClientRect().top-70);const gap=12,R=VB[3]/VB[2]+.06;let best={cw:0,cols:1};
  for(let cols=1;cols<=n;cols++){const rows=Math.ceil(n/cols);const cw=Math.min((W-gap*(cols-1))/cols,((H-gap*(rows-1))/rows)/R);if(cw>best.cw)best={cw,cols}}
  grid.style.gridTemplateColumns=`repeat(${best.cols}, ${Math.floor(Math.max(72,Math.min(250,best.cw)))}px)`};
 fit();addEventListener('resize',fit);G.stops.push(()=>removeEventListener('resize',fit));
}

/* ---------- game flow ---------- */
function startGame(mode){G.mode=mode;G.level=1;G.score=0;levelSplash()}
function tipFor(){
 const L=G.level,m=G.mode;
 if(L===1)return{classic:'Memorize the face, then find it!',spot:'Memorize the face, then tap what changed!',build:'Remember 3 things about this face, then build it back!',lineup:'Memorize every face, then find them all!'}[m];
 const a=cfg(L-1),b=cfg(L),t=[];
 if(m!=='build'&&b.mem<a.mem)t.push(`Only ${m==='lineup'?Math.round(b.mem*(L<=4?2:3)*.8):b.mem} seconds to memorize!`);
 if(m==='classic'&&b.choices>a.choices)t.push(`Now ${b.choices} faces to choose from!`);
 if((m==='classic'||m==='lineup')&&b.changes<a.changes)t.push('The fakes look more alike now!');
 if(m!=='build'&&stage(L)>stage(L-1))t.push('Sneakier changes ahead!');
 if(m==='build'){if(buildCount(L)>buildCount(L-1))t.push(`Now ${buildCount(L)} pieces to remember!`);else if(buildMem(L)<buildMem(L-1))t.push(`Every piece now! Only ${buildMem(L)} seconds to memorize!`);if(buildOpts(L)>buildOpts(L-1))t.push(`${buildOpts(L)} choices for each piece!`)}
 if(m==='lineup'&&L===5)t.push('Now 3 faces to memorize!');
 return t.join(' ')||pick(['You got this!','Keep going!','Sharp eyes!','Nice memory!','On a roll!']);
}
function levelSplash(){
 show(`<div class="splash"><div class="lvl">Level ${G.level}</div><div class="sub">${tipFor()}</div></div>`);
 SFX.whoosh();later(()=>({classic:classicRound,spot:spotRound,build:buildRound,lineup:lineupRound})[G.mode](),G.level===1?1600:1300);
}
function award(frac){const pts=100+10*(G.level-1)+Math.round(100*frac);G.score+=pts;SFX.ding();return pts}
function roundWin(frac,el){
 const pts=award(frac);
 const s=$('#hudScore');if(s)s.textContent=G.score;
 floatText('+'+pts+(frac>.6?' Speedy!':''),el);
 G.level++;later(levelSplash,1200);
}
function memorizeScreen(faces,sec,next,msg){
 show(`${hud()}<h2 class="prompt">${msg}</h2>
 <div class="memo memo-${faces.length}">${faces.map((f,i)=>`<div class="facecard big">${faces.length>1?`<span class="badge">${i+1}</span>`:''}${faceSVG(f)}</div>`).join('')}</div>
 ${timerHTML()}<div class="row"><button class="btn primary" id="ready">I'm ready! ▶</button></div>`);
 let done=false;const go=()=>{if(done)return;done=true;next()};
 timer(sec,$('.timer'),go);$('#ready').onclick=()=>{SFX.click();go()};
}
function choiceScreen(opts,sec,onPick,onTimeout,msg){
 show(`${hud()}<h2 class="prompt">${msg}</h2><div class="grid" id="grid">${opts.map((o,i)=>`<button class="facecard pick" data-i="${i}">${faceSVG(o.f)}</button>`).join('')}</div>${timerHTML()}`);
 layoutGrid(opts.length);
 let lock=false;
 const t=timer(sec,$('.timer'),()=>{lock=true;onTimeout()});
 $('#grid').onclick=e=>{const b=e.target.closest('.pick');if(!b||lock||b.disabled)return;const r=onPick(+b.dataset.i,b,t);if(r==='stop'){lock=true;t.stop()}};
}

function classicRound(){
 const c=cfg(G.level),target=randomFace(),used=new Set([visKey(target)]);
 memorizeScreen([target],c.mem,()=>{
  const opts=shuffle([{f:target,ok:true},...range(c.choices-1).map(()=>({f:makeDecoy(target,c.changes,c.pool,used),ok:false}))]);
  choiceScreen(opts,c.pick,(i,btn,t)=>{
   const o=opts[i];
   if(o.ok){btn.classList.add('right');roundWin(t.frac(),btn);return'stop'}
   gameOver({reason:'wrong',real:target,picked:o.f,diffs:diffKeys(target,o.f)});return'stop';
  },()=>gameOver({reason:'time',real:target}),'Which one is it?');
 },'Memorize this face!');
}

const CATS=[
 {id:'hat',name:'Hat',icon:'🎩',keys:['hat','hatColor']},
 {id:'hair',name:'Hair',icon:'💇',keys:['hairStyle','hairColor']},
 {id:'brows',name:'Eyebrows',icon:'🤨',keys:['eyebrows']},
 {id:'eyes',name:'Eyes',icon:'👁️',keys:['eyes','eyeColor']},
 {id:'glasses',name:'Glasses',icon:'👓',keys:['glasses']},
 {id:'nose',name:'Nose',icon:'👃',keys:['nose']},
 {id:'mouth',name:'Mouth',icon:'👄',keys:['mouth']},
 {id:'ears',name:'Ears',icon:'👂',keys:['ears']},
 {id:'earrings',name:'Earrings',icon:'💎',keys:['earrings']},
 {id:'beard',name:'Beard or mustache',icon:'🧔',keys:['facialHair']},
 {id:'cheeks',name:'Cheeks',icon:'😊',keys:['cheeks']},
 {id:'neck',name:'Neckwear',icon:'🎀',keys:['neckwear']},
 {id:'shirt',name:'Shirt',icon:'👕',keys:['shirt']},
 {id:'shape',name:'Face shape',icon:'🥚',keys:['faceShape']},
 {id:'skin',name:'Skin color',icon:'🎨',keys:['skin']}
];
function spotRound(){
 const L=G.level,c=cfg(L),target=randomFace();
 const changed=makeDecoy(target,1,c.pool,new Set([visKey(target)])),diffs=diffKeys(target,changed);
 const rightCats=CATS.filter(ct=>ct.keys.some(k=>diffs.includes(k)));
 const nChoices=Math.min(CATS.length,4+Math.floor((L-1)/2));
 const others=shuffle(CATS.filter(ct=>!rightCats.includes(ct))).slice(0,Math.max(0,nChoices-1));
 const choices=shuffle([rightCats[0],...others]);
 memorizeScreen([target],c.mem,()=>{
  show(`${hud()}<div class="splash"><div class="looking">👀 Look closely…</div></div>`);
  later(()=>{
   show(`${hud()}<h2 class="prompt">What changed?</h2><div class="memo spotwrap"><div class="facecard big" id="spotFace">${faceSVG(changed)}</div></div>${timerHTML()}<div class="cats" id="cats">${choices.map((ct,i)=>`<button class="cat" data-i="${i}"><span>${ct.icon}</span><span>${ct.name}</span></button>`).join('')}</div>`);
   let lock=false;
   const t=timer(c.pick,$('.timer'),()=>{lock=true;gameOver({reason:'time',real:target,picked:changed,diffs,realLabel:'Before',pickLabel:'After'})});
   $('#cats').onclick=e=>{
    const b=e.target.closest('.cat');if(!b||lock)return;lock=true;const fr=t.frac();t.stop();
    const ct=choices[+b.dataset.i];
    if(rightCats.includes(ct)){
     b.classList.add('right');const pts=award(fr);
     later(()=>{
      show(`${hud()}<h2 class="prompt" style="color:var(--good)">✓ Yes! The ${ct.name.toLowerCase()} changed!</h2>
      <div class="compare">
       <figure class="facecard big ok">${faceSVG(target,{hl:diffs,good:true})}<figcaption>Before</figcaption></figure>
       <figure class="facecard big ok">${faceSVG(changed,{hl:diffs,good:true})}<figcaption>After</figcaption></figure>
      </div>
      <p class="diffs">Changed: <b>${diffs.map(k=>FEATURES[k].label).join(', ')}</b></p>
      <div class="row"><button class="btn primary" id="nextLvl">Next level ▶</button></div>`);
      floatText('+'+pts+(fr>.6?' Speedy!':''),$('.compare'));
      $('#nextLvl').onclick=()=>{SFX.click();G.level++;levelSplash()};
     },450);
    }
    else gameOver({reason:'wrong',real:target,picked:changed,diffs,realLabel:'Before',pickLabel:`After (you picked ${ct.name})`});
   };
  },1100);
 },'Memorize this face! Something will change…');
}

function buildRound(){
 const L=G.level,count=buildCount(L),nOpts=buildOpts(L);
 const pool=shuffle((L<=4?BUILD_EASY:BUILD_ALL).slice());
 let keys=pool.slice(0,count);
 if(keys.length<count)keys=keys.concat(shuffle(BUILD_ALL.filter(k=>!keys.includes(k)))).slice(0,count);
 keys.sort((a,b)=>KEYS.indexOf(a)-KEYS.indexOf(b));
 const eyesIn=keys.includes('eyes')||keys.includes('eyeColor');
 const plain={...PLAIN,hatColor:rnd(HATC.length)};
 const target={...plain};
 const allowed=k=>range(FEATURES[k].n).filter(v=>!(k==='hairStyle'&&v===7&&keys.includes('hat'))&&!(k==='glasses'&&v===3&&eyesIn));
 keys.forEach(k=>{target[k]=pick(allowed(k).filter(v=>v!==plain[k]))});
 const options={},cur={...plain};
 keys.forEach(k=>{const rest=shuffle(allowed(k).filter(v=>v!==target[k]&&v!==plain[k])).slice(0,Math.max(0,nOpts-2));options[k]=shuffle([target[k],plain[k],...rest])});
 const total=Math.round(count*Math.max(3.5,7-L*.2))+5;
 const list=keys.map(k=>FEATURES[k].label).join(', ');
 memorizeScreen([target],buildMem(L),()=>{
  show(`${hud()}<h2 class="prompt">Build the face!</h2>${timerHTML()}<div class="build"><div class="facecard big" id="bPrev"></div><div class="bpanel"><div class="chips" id="chips"></div><div class="blabel" id="blabel"></div><div class="bopts" id="bopts"></div><div class="row" style="margin:4px 0"><button class="btn primary" id="check" disabled>Check! ✔</button></div></div></div>`);
  const chosen=new Set();let step=0,lock=false;
  const draw=()=>{
   $('#bPrev').innerHTML=faceSVG(cur);
   $('#chips').innerHTML=keys.map((k,i)=>`<button class="chip${i===step?' on':''}${chosen.has(k)?' done':''}" data-i="${i}">${chosen.has(k)?'✓ ':''}${FEATURES[k].label}</button>`).join('');
   const k=keys[step];$('#blabel').textContent=`Pick the ${FEATURES[k].label} (${step+1} of ${keys.length})`;
   $('#bopts').innerHTML=options[k].map(v=>{const ff={...cur,[k]:v};return`<button class="facecard opt${chosen.has(k)&&cur[k]===v?' sel':''}" data-v="${v}">${faceSVG(ff,{vb:cropBox(ff,k)})}</button>`}).join('');
   $('#check').disabled=chosen.size<keys.length;
  };
  const finish=fr=>{
   lock=true;const wrong=keys.filter(k=>cur[k]!==target[k]);
   if(!wrong.length&&fr!==null){roundWin(fr,$('#bPrev'));return}
   gameOver({reason:fr===null?'time':'wrong',real:target,picked:{...cur},diffs:wrong,pickLabel:'Your face'});
  };
  $('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b||lock)return;SFX.click();step=+b.dataset.i;draw()};
  $('#bopts').onclick=e=>{const b=e.target.closest('.opt');if(!b||lock)return;const k=keys[step];cur[k]=+b.dataset.v;chosen.add(k);SFX.pop();
   const nxt=keys.findIndex((kk,i)=>i>step&&!chosen.has(kk));const any=keys.findIndex(kk=>!chosen.has(kk));
   draw();if(nxt>=0||any>=0){later(()=>{if(lock)return;step=nxt>=0?nxt:any;draw()},260)}};
  const t=timer(total,$('.timer'),()=>finish(null));
  $('#check').onclick=()=>{if(lock)return;const fr=t.frac();t.stop();finish(fr)};
  draw();
 },`Remember these ${count}: ${list}`);
}

function lineupRound(){
 const L=G.level,c=cfg(L),nT=L<=4?2:3,total=Math.min(9,nT+2+Math.floor((L-1)/2)),mem=Math.round(c.mem*nT*.8);
 const used=new Set(),targets=[];
 while(targets.length<nT){const f=randomFace(),k=visKey(f);if(!used.has(k)){used.add(k);targets.push(f)}}
 const decoys=range(total-nT).map(i=>{const src=targets[i%nT];return{f:makeDecoy(src,c.changes,c.pool,used),ok:false,src}});
 const opts=shuffle([...targets.map(f=>({f,ok:true,src:f})),...decoys]);
 memorizeScreen(targets,mem,()=>{
  const found=new Set();
  choiceScreen(opts,c.pick+3*nT,(i,btn,t)=>{
   const o=opts[i];
   if(o.ok){btn.disabled=true;btn.classList.add('found');found.add(o.f);if(found.size===nT){roundWin(t.frac(),btn);return'stop'}SFX.pop();return}
   gameOver({reason:'wrong',real:o.src,picked:o.f,diffs:diffKeys(o.src,o.f),realLabel:'The real face'});return'stop';
  },()=>{const miss=targets.find(f=>!found.has(f));gameOver({reason:'time',real:miss,realLabel:'You missed this one'})},`Find all ${nT} faces!`);
 },`Memorize these ${nT} faces!`);
}

function gameOver(info){
 SFX.buzz();
 const labels=info.diffs&&info.diffs.length?info.diffs.map(k=>FEATURES[k].label):[];
 show(`${hud()}<h2 class="prompt bad">${info.reason==='time'?"⏰ Time's up!":'Oops! Not quite.'}</h2>
 <div class="compare">
  <figure class="facecard big ok">${faceSVG(info.real,{hl:info.picked?info.diffs:null})}<figcaption>${info.realLabel||'The real face'}</figcaption></figure>
  ${info.picked?`<figure class="facecard big wrong">${faceSVG(info.picked,{hl:info.diffs,mark:info.tap})}<figcaption>${info.pickLabel||'Your pick'}</figcaption></figure>`:''}
 </div>
 ${labels.length?`<p class="diffs">Different: <b>${labels.join(', ')}</b></p>`:''}
 <div class="final sketch"><div>Final score</div><div class="bigscore">${G.score}</div><div>You reached level ${G.level}</div>
 <div class="hs-area" id="hsArea">Checking high scores…</div>
 <div class="row"><button class="btn primary" id="again">Play again ↻</button><button class="btn" id="menu">Menu</button><button class="btn" id="seeHs">🏆</button></div></div>`);
 $('#again').onclick=()=>{SFX.click();startGame(G.mode)};
 $('#menu').onclick=()=>{SFX.click();titleScreen()};
 $('#seeHs').onclick=()=>{SFX.click();boardScreen(G.mode)};
 const tok=G.screen;
 Store.load().then(all=>{
  if(tok!==G.screen)return;const area=$('#hsArea'),list=all[G.mode];
  const qual=G.score>0&&(list.length<10||G.score>list[list.length-1].s);
  if(!qual){area.innerHTML=G.score===0?'Keep practicing!':`Top 10 needs <b>${list[list.length-1].s+1}</b> points. So close!`;return}
  area.innerHTML=`<div class="newhs">🌟 You made the Top 10! 🌟</div><div class="nameRow"><input id="nm" maxlength="12" placeholder="Your name" autocomplete="off"><button class="btn primary" id="saveHs">Save</button></div>`;
  SFX.fanfare();const inp=$('#nm');inp.value=ls.get('wt_name')||'';
  let saving=false;
  const save=async()=>{if(saving)return;saving=true;const n=(inp.value.trim().replace(/\s+/g,' ')||'Player').slice(0,12);ls.set('wt_name',n);
   $('#saveHs').disabled=true;$('#saveHs').textContent='Saving…';
   const entry={n,s:G.score,l:G.level,t:Date.now()};const ok=await Store.save(G.mode,entry);
   if(tok!==G.screen)return;
   boardScreen(G.mode,entry.t,ok?null:"Couldn't reach the shared board, so this score was saved on this device.")};
  $('#saveHs').onclick=save;inp.onkeydown=e=>{if(e.key==='Enter')save()};
 });
}

titleScreen();
</script>
</body>
