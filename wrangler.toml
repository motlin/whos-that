# One Worker: the built game as static assets, and the leaderboard API in front of D1.
#
#   just worker   builds, applies the migrations to a local D1 and serves everything on miniflare
#   just deploy   applies the migrations to the production D1 and deploys to whos-that.motlin.com
#
# The custom domain is a flag on `wrangler deploy` (see the deploy recipe and .github/workflows/deploy.yml)
# rather than a route here, the same way elemental-arena does it.
name = "whos-that"
main = "src/worker/index.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "dist"
binding = "ASSETS"
# Only /api/* reaches the Worker first; every other path is the game's static files.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "whos-that"
# Placeholder until the first deploy: replace it with the id `wrangler d1 create whos-that` prints.
database_id = "e854cbfd-5b8f-4941-abe7-a460ace2057f"
migrations_dir = "migrations"
